name: Verify

on:
  push:
  pull_request:

jobs:
  diagrams-and-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: node --test tests/*.test.mjs
      - run: python scripts/build.py
