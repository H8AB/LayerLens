<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1575" viewBox="0 0 1600 1575" role="img" aria-labelledby="t d"><title id="t">How does a robot arm become a welding cell?</title><desc id="d">Follow the handoffs from a joint reducer to an accepted weld. Each supplier delivers a different capability.</desc><rect x="0" y="0" width="1600" height="1575" fill="#f6f5ef"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="56" y="46" width="8" height="26" fill="#bc7042"/><text x="78" y="67" fill="#172b37" font-size="24" font-weight="700" >LayerLens</text><text x="1544" y="66" fill="#172b37" font-size="20" font-weight="600" text-anchor="end">Industry value chain</text><path d="M56 91H1544" fill="none" stroke="#adbbb4" stroke-width="1" /><text x="56" y="174" fill="#172b37" font-size="59" font-weight="750" >How does a robot arm become a welding cell?</text><text x="60" y="251" fill="#3e5560" font-size="25" font-weight="400" >Follow the handoffs from a joint reducer to an accepted weld. Each supplier delivers a different capability.</text><text x="60" y="293" fill="#336861" font-size="18" font-weight="550" >Scope  /  Industrial robots used in arc welding</text><rect x="56" y="335" width="1488" height="594" fill="#123841"/><text x="96" y="391" fill="#ffffff" font-size="29" font-weight="650" >Four roles from joint motion to weld quality</text><g transform="translate(250.625 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-46 34h92m-107-34h22m78 0h22"/><circle r="33"/><circle r="21"/><circle r="8"/><path transform="rotate(0)" d="M-5-33v-7h10v7"/><path transform="rotate(30)" d="M-5-33v-7h10v7"/><path transform="rotate(60)" d="M-5-33v-7h10v7"/><path transform="rotate(90)" d="M-5-33v-7h10v7"/><path transform="rotate(120)" d="M-5-33v-7h10v7"/><path transform="rotate(150)" d="M-5-33v-7h10v7"/><path transform="rotate(180)" d="M-5-33v-7h10v7"/><path transform="rotate(210)" d="M-5-33v-7h10v7"/><path transform="rotate(240)" d="M-5-33v-7h10v7"/><path transform="rotate(270)" d="M-5-33v-7h10v7"/><path transform="rotate(300)" d="M-5-33v-7h10v7"/><path transform="rotate(330)" d="M-5-33v-7h10v7"/></g><text x="96" y="592" fill="#ffffff" font-size="29" font-weight="700" >Component maker</text><text x="96" y="638" fill="#83d9bc" font-size="23" font-weight="570" >Joint transmission</text><text x="96" y="677" fill="#dae9e5" font-size="20" font-weight="400" >A precision reducer works</text><text x="96" y="707" fill="#dae9e5" font-size="20" font-weight="400" >with the motor to deliver</text><text x="96" y="737" fill="#dae9e5" font-size="20" font-weight="400" >the speed and torque a joint</text><text x="96" y="767" fill="#dae9e5" font-size="20" font-weight="400" >needs.</text><path d="M407.25 507h45m-10-8 10 8-10 8" fill="none" stroke="#eeac66" stroke-width="2" /><g transform="translate(616.875 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-59 35h53l-5-9h-43zm12-9 14-41 12 3-11 38m9-44 49-15 5 9-46 21m44-24 14 19-6 5-17-15m23 12 10 4-2 8m-8-9-3 8"/><circle cx="-24" cy="-13" r="8"/><circle cx="24" cy="-28" r="6"/></g><text x="462.25" y="592" fill="#ffffff" font-size="29" font-weight="700" >Robot maker</text><text x="462.25" y="638" fill="#83d9bc" font-size="23" font-weight="570" >Controlled motion</text><text x="462.25" y="677" fill="#dae9e5" font-size="20" font-weight="400" >Mechanical joints, drives</text><text x="462.25" y="707" fill="#dae9e5" font-size="20" font-weight="400" >and a controller move the</text><text x="462.25" y="737" fill="#dae9e5" font-size="20" font-weight="400" >arm along a programmed</text><text x="462.25" y="767" fill="#dae9e5" font-size="20" font-weight="400" >path.</text><path d="M773.5 507h45m-10-8 10 8-10 8" fill="none" stroke="#eeac66" stroke-width="2" /><g transform="translate(983.125 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-68 35v-71h136v71zm6-65h94v58h-94zm100 0h24v58H38zM-53 22h25l-8-8 11-25 25 9 6 17m-1-10 13 5m-8 3h18v6H4zm38-37h15v8H42z"/><circle cx="-25" cy="-9" r="3"/></g><text x="828.5" y="592" fill="#ffffff" font-size="29" font-weight="700" >System integrator</text><text x="828.5" y="638" fill="#83d9bc" font-size="23" font-weight="570" >Welding cell</text><text x="828.5" y="677" fill="#dae9e5" font-size="20" font-weight="400" >The integrator selects the</text><text x="828.5" y="707" fill="#dae9e5" font-size="20" font-weight="400" >torch, power supply,</text><text x="828.5" y="737" fill="#dae9e5" font-size="20" font-weight="400" >fixtures and guarding, then</text><text x="828.5" y="767" fill="#dae9e5" font-size="20" font-weight="400" >programs and tests the cell.</text><path d="M1139.75 507h45m-10-8 10 8-10 8" fill="none" stroke="#eeac66" stroke-width="2" /><g transform="translate(1349.375 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m-66 22 54-36 14 9-52 37zm68-27 48 25 15-9-51-28zm-6-7 15-9m-71 47v8l13 7L3 7l47 24 15-9v-10"/><path stroke-dasharray="3 5" d="m-40 21 42-28"/></g><text x="1194.75" y="592" fill="#ffffff" font-size="29" font-weight="700" >Factory</text><text x="1194.75" y="638" fill="#83d9bc" font-size="23" font-weight="570" >Accepted parts</text><text x="1194.75" y="677" fill="#dae9e5" font-size="20" font-weight="400" >The factory checks weld</text><text x="1194.75" y="707" fill="#dae9e5" font-size="20" font-weight="400" >quality and cycle time</text><text x="1194.75" y="737" fill="#dae9e5" font-size="20" font-weight="400" >against its requirements</text><text x="1194.75" y="767" fill="#dae9e5" font-size="20" font-weight="400" >and plans maintenance.</text><text x="96" y="814" fill="#eeac66" font-size="17" font-weight="550" >→  Deliver to the next role</text><path d="M1349.375 844v10h-366.25m10-7-10 7 10 7" fill="none" stroke="#eeac66" stroke-width="2" /><text x="96" y="885" fill="#f1dbb8" font-size="20" font-weight="500" >←  The factory specifies part size, weld locations and cycle time. The integrator uses these to select equipment.</text><path d="M56 963h464" fill="none" stroke="#aebdb7" stroke-width="1.5" /><text x="56" y="999" fill="#172b37" font-size="26" font-weight="700" >What does the joint supply?</text><text x="56" y="1046" fill="#3e5560" font-size="22" font-weight="400" >A reducer transmits motion at the</text><text x="56" y="1079" fill="#3e5560" font-size="22" font-weight="400" >joint. Motor sizing, sensing and</text><text x="56" y="1112" fill="#3e5560" font-size="22" font-weight="400" >control also shape how the arm moves.</text><text x="56" y="1145" fill="#3e5560" font-size="22" font-weight="400" >[1, 2]</text><path d="M568 963h464" fill="none" stroke="#aebdb7" stroke-width="1.5" /><text x="568" y="999" fill="#172b37" font-size="26" font-weight="700" >What does integration add?</text><text x="568" y="1046" fill="#3e5560" font-size="22" font-weight="400" >The arm can reach a point in space.</text><text x="568" y="1079" fill="#3e5560" font-size="22" font-weight="400" >Making a repeatable weld also takes a</text><text x="568" y="1112" fill="#3e5560" font-size="22" font-weight="400" >fixture that locates the part and a</text><text x="568" y="1145" fill="#3e5560" font-size="22" font-weight="400" >torch and power source working</text><text x="568" y="1178" fill="#3e5560" font-size="22" font-weight="400" >together.  [2, 3]</text><path d="M1080 963h464" fill="none" stroke="#aebdb7" stroke-width="1.5" /><text x="1080" y="999" fill="#172b37" font-size="26" font-weight="700" >How is value verified?</text><text x="1080" y="1046" fill="#3e5560" font-size="22" font-weight="400" >Trial-weld a representative part,</text><text x="1080" y="1079" fill="#3e5560" font-size="22" font-weight="400" >inspect the joint and time the full</text><text x="1080" y="1112" fill="#3e5560" font-size="22" font-weight="400" >cycle. These checks show whether the</text><text x="1080" y="1145" fill="#3e5560" font-size="22" font-weight="400" >cell meets production needs.  [3, 4]</text><rect x="56" y="1236" width="1488" height="192" fill="#e4ece5"/><rect x="56" y="1236" width="7" height="192" fill="#428177"/><text x="83" y="1280" fill="#172b37" font-size="26" font-weight="700" >What if the fixture shifts?</text><text x="83" y="1320" fill="#172b37" font-size="21" font-weight="400" >The real seam can move away from the programmed path. An</text><text x="83" y="1352" fill="#172b37" font-size="21" font-weight="400" >integrator can improve the fixture or add seam finding, then</text><text x="83" y="1384" fill="#172b37" font-size="21" font-weight="400" >check how the extra motion affects cycle time.  [3]</text><text x="915" y="1280" fill="#172b37" font-size="22" font-weight="680" >Scope and assumptions</text><text x="915" y="1322" fill="#3e5560" font-size="21" font-weight="400" >These roles can overlap. Welding equipment and</text><text x="915" y="1354" fill="#3e5560" font-size="21" font-weight="400" >tooling may be supplied directly to the integrator.</text><text x="915" y="1386" fill="#3e5560" font-size="21" font-weight="400" >The diagram covers industrial arc welding.</text><text x="56" y="1470" fill="#172b37" font-size="18" font-weight="700" >Sources</text><a href="https://www.hds.co.jp/english/company/business/example/" xlink:href="https://www.hds.co.jp/english/company/business/example/"><text x="56" y="1505" fill="#275e63" font-size="18" font-weight="500" >[1]   Harmonic Drive · Joint reducers</text></a><a href="https://global.abb/content/dam/abb/global/group/investors/documents/ir-events/2017/Glossary%20of%20technical%20terms%20-%20abb-innovation-technology-day%20-%202017.pdf" xlink:href="https://global.abb/content/dam/abb/global/group/investors/documents/ir-events/2017/Glossary%20of%20technical%20terms%20-%20abb-innovation-technology-day%20-%202017.pdf"><text x="796" y="1505" fill="#275e63" font-size="18" font-weight="500" >[2]   ABB · Robotics glossary</text></a><a href="https://qacd10.lincolnelectric.com/en-GB/Welding-and-Cutting-Resource-Center/Process-and-Theory/Intelligent-Robotic-Arc-Sensing" xlink:href="https://qacd10.lincolnelectric.com/en-GB/Welding-and-Cutting-Resource-Center/Process-and-Theory/Intelligent-Robotic-Arc-Sensing"><text x="56" y="1540" fill="#275e63" font-size="18" font-weight="500" >[3]   Lincoln Electric · Arc sensing</text></a><a href="https://ch-delivery.lincolnelectric.com/api/public/content/20f948ba18cf4c10a276d54630974fb1?v=1b992607" xlink:href="https://ch-delivery.lincolnelectric.com/api/public/content/20f948ba18cf4c10a276d54630974fb1?v=1b992607"><text x="796" y="1540" fill="#275e63" font-size="18" font-weight="500" >[4]   Lincoln Electric · Customer case</text></a></g></svg>