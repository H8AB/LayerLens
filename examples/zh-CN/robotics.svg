<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1417" viewBox="0 0 1600 1417" role="img" aria-labelledby="t d"><title id="t">一台机械臂，怎样变成焊接产能？</title><desc id="d">沿着一件焊接工件追踪交付物。减速器、机器人和整套工作站各解决一个不同的问题。</desc><rect x="0" y="0" width="1600" height="1417" fill="#f6f5ef"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="56" y="46" width="8" height="26" fill="#bc7042"/><text x="78" y="67" fill="#172b37" font-size="24" font-weight="700" >图个明白</text><text x="1544" y="66" fill="#172b37" font-size="20" font-weight="600" text-anchor="end">产业链条</text><path d="M56 91H1544" fill="none" stroke="#adbbb4" stroke-width="1" /><text x="56" y="174" fill="#172b37" font-size="59" font-weight="750" >一台机械臂，怎样变成焊接产能？</text><text x="60" y="251" fill="#3e5560" font-size="25" font-weight="400" >沿着一件焊接工件追踪交付物。减速器、机器人和整套工作站各解决一个不同的问题。</text><text x="60" y="293" fill="#336861" font-size="18" font-weight="550" >研究范围  /  工业机器人产业链 · 弧焊工作站</text><rect x="56" y="335" width="1488" height="534" fill="#123841"/><text x="96" y="391" fill="#ffffff" font-size="29" font-weight="650" >从关节部件到可投产的工作站</text><g transform="translate(250.625 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-46 34h92m-107-34h22m78 0h22"/><circle r="33"/><circle r="21"/><circle r="8"/><path transform="rotate(0)" d="M-5-33v-7h10v7"/><path transform="rotate(30)" d="M-5-33v-7h10v7"/><path transform="rotate(60)" d="M-5-33v-7h10v7"/><path transform="rotate(90)" d="M-5-33v-7h10v7"/><path transform="rotate(120)" d="M-5-33v-7h10v7"/><path transform="rotate(150)" d="M-5-33v-7h10v7"/><path transform="rotate(180)" d="M-5-33v-7h10v7"/><path transform="rotate(210)" d="M-5-33v-7h10v7"/><path transform="rotate(240)" d="M-5-33v-7h10v7"/><path transform="rotate(270)" d="M-5-33v-7h10v7"/><path transform="rotate(300)" d="M-5-33v-7h10v7"/><path transform="rotate(330)" d="M-5-33v-7h10v7"/></g><text x="96" y="592" fill="#ffffff" font-size="29" font-weight="700" >部件供应商</text><text x="96" y="638" fill="#83d9bc" font-size="23" font-weight="570" >关节传动</text><text x="96" y="677" fill="#dae9e5" font-size="20" font-weight="400" >提供精密减速器，配合电机传递</text><text x="96" y="707" fill="#dae9e5" font-size="20" font-weight="400" >关节所需的转速和转矩。</text><path d="M407.25 507h45m-10-8 10 8-10 8" fill="none" stroke="#eeac66" stroke-width="2" /><g transform="translate(616.875 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-59 35h53l-5-9h-43zm12-9 14-41 12 3-11 38m9-44 49-15 5 9-46 21m44-24 14 19-6 5-17-15m23 12 10 4-2 8m-8-9-3 8"/><circle cx="-24" cy="-13" r="8"/><circle cx="24" cy="-28" r="6"/></g><text x="462.25" y="592" fill="#ffffff" font-size="29" font-weight="700" >机器人制造商</text><text x="462.25" y="638" fill="#83d9bc" font-size="23" font-weight="570" >受控运动</text><text x="462.25" y="677" fill="#dae9e5" font-size="20" font-weight="400" >把机械结构、驱动和控制器组成</text><text x="462.25" y="707" fill="#dae9e5" font-size="20" font-weight="400" >能够按轨迹运动的机器人。</text><path d="M773.5 507h45m-10-8 10 8-10 8" fill="none" stroke="#eeac66" stroke-width="2" /><g transform="translate(983.125 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-68 35v-71h136v71zm6-65h94v58h-94zm100 0h24v58H38zM-53 22h25l-8-8 11-25 25 9 6 17m-1-10 13 5m-8 3h18v6H4zm38-37h15v8H42z"/><circle cx="-25" cy="-9" r="3"/></g><text x="828.5" y="592" fill="#ffffff" font-size="29" font-weight="700" >系统集成商</text><text x="828.5" y="638" fill="#83d9bc" font-size="23" font-weight="570" >焊接工作站</text><text x="828.5" y="677" fill="#dae9e5" font-size="20" font-weight="400" >匹配焊源、焊枪、夹具和防护，</text><text x="828.5" y="707" fill="#dae9e5" font-size="20" font-weight="400" >编程并调试整站。</text><path d="M1139.75 507h45m-10-8 10 8-10 8" fill="none" stroke="#eeac66" stroke-width="2" /><g transform="translate(1349.375 505)" fill="none" stroke="#83d9bc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m-66 22 54-36 14 9-52 37zm68-27 48 25 15-9-51-28zm-6-7 15-9m-71 47v8l13 7L3 7l47 24 15-9v-10"/><path stroke-dasharray="3 5" d="m-40 21 42-28"/></g><text x="1194.75" y="592" fill="#ffffff" font-size="29" font-weight="700" >制造工厂</text><text x="1194.75" y="638" fill="#83d9bc" font-size="23" font-weight="570" >合格工件</text><text x="1194.75" y="677" fill="#dae9e5" font-size="20" font-weight="400" >按产品要求验证焊缝质量与生产</text><text x="1194.75" y="707" fill="#dae9e5" font-size="20" font-weight="400" >节拍，并安排日常维护。</text><text x="96" y="754" fill="#eeac66" font-size="17" font-weight="550" >→  交付</text><path d="M1349.375 784v10h-366.25m10-7-10 7 10 7" fill="none" stroke="#eeac66" stroke-width="2" /><text x="96" y="825" fill="#f1dbb8" font-size="20" font-weight="500" >←  工厂提出工件尺寸、焊缝位置和目标节拍，集成商据此选型与布置。</text><path d="M56 903h464" fill="none" stroke="#aebdb7" stroke-width="1.5" /><text x="56" y="939" fill="#172b37" font-size="26" font-weight="700" >部件提供什么能力？</text><text x="56" y="986" fill="#3e5560" font-size="22" font-weight="400" >减速器可用于机器人关节。关节的运动表现还</text><text x="56" y="1019" fill="#3e5560" font-size="22" font-weight="400" >取决于电机、传感与控制，单个部件只是整机</text><text x="56" y="1052" fill="#3e5560" font-size="22" font-weight="400" >性能的一项因素。  [1, 2]</text><path d="M568 903h464" fill="none" stroke="#aebdb7" stroke-width="1.5" /><text x="568" y="939" fill="#172b37" font-size="26" font-weight="700" >为什么要单列集成？</text><text x="568" y="986" fill="#3e5560" font-size="22" font-weight="400" >机械臂能够到达一个位置，焊接还需要可靠地</text><text x="568" y="1019" fill="#3e5560" font-size="22" font-weight="400" >定位工件，并让焊枪、焊接电源及工装协调工</text><text x="568" y="1052" fill="#3e5560" font-size="22" font-weight="400" >作。  [2, 3]</text><path d="M1080 903h464" fill="none" stroke="#aebdb7" stroke-width="1.5" /><text x="1080" y="939" fill="#172b37" font-size="26" font-weight="700" >价值如何被验证？</text><text x="1080" y="986" fill="#3e5560" font-size="22" font-weight="400" >可用同一个工件做试焊，检查接头质量并记录</text><text x="1080" y="1019" fill="#3e5560" font-size="22" font-weight="400" >完整循环用时。工厂据此判断工作站能否满足</text><text x="1080" y="1052" fill="#3e5560" font-size="22" font-weight="400" >产线要求。  [3, 4]</text><rect x="56" y="1110" width="1488" height="160" fill="#e4ece5"/><rect x="56" y="1110" width="7" height="160" fill="#428177"/><text x="83" y="1154" fill="#172b37" font-size="26" font-weight="700" >夹具偏一点，影响会传到哪一层？</text><text x="83" y="1194" fill="#172b37" font-size="21" font-weight="400" >工件偏移会使实际焊缝偏离程序轨迹。集成商可改善定位或加入寻位功能，</text><text x="83" y="1226" fill="#172b37" font-size="21" font-weight="400" >同时评估额外动作对节拍的影响。  [3]</text><text x="915" y="1154" fill="#172b37" font-size="22" font-weight="680" >适用边界</text><text x="915" y="1196" fill="#3e5560" font-size="21" font-weight="400" >按交付角色划分，同一家企业可以兼任制造与集成。焊源、</text><text x="915" y="1228" fill="#3e5560" font-size="21" font-weight="400" >工装等也可直接供给集成商。范围限于工业弧焊场景。</text><text x="56" y="1312" fill="#172b37" font-size="18" font-weight="700" >资料索引</text><a href="https://www.hds.co.jp/english/company/business/example/" xlink:href="https://www.hds.co.jp/english/company/business/example/"><text x="56" y="1347" fill="#275e63" font-size="18" font-weight="500" >[1]   Harmonic Drive · 关节减速器</text></a><a href="https://global.abb/content/dam/abb/global/group/investors/documents/ir-events/2017/Glossary%20of%20technical%20terms%20-%20abb-innovation-technology-day%20-%202017.pdf" xlink:href="https://global.abb/content/dam/abb/global/group/investors/documents/ir-events/2017/Glossary%20of%20technical%20terms%20-%20abb-innovation-technology-day%20-%202017.pdf"><text x="796" y="1347" fill="#275e63" font-size="18" font-weight="500" >[2]   ABB · 工业机器人术语</text></a><a href="https://qacd10.lincolnelectric.com/en-GB/Welding-and-Cutting-Resource-Center/Process-and-Theory/Intelligent-Robotic-Arc-Sensing" xlink:href="https://qacd10.lincolnelectric.com/en-GB/Welding-and-Cutting-Resource-Center/Process-and-Theory/Intelligent-Robotic-Arc-Sensing"><text x="56" y="1382" fill="#275e63" font-size="18" font-weight="500" >[3]   Lincoln Electric · 焊缝寻位</text></a><a href="https://ch-delivery.lincolnelectric.com/api/public/content/20f948ba18cf4c10a276d54630974fb1?v=1b992607" xlink:href="https://ch-delivery.lincolnelectric.com/api/public/content/20f948ba18cf4c10a276d54630974fb1?v=1b992607"><text x="796" y="1382" fill="#275e63" font-size="18" font-weight="500" >[4]   Lincoln Electric · 应用案例</text></a></g></svg>