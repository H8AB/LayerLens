<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14283a">
  <title data-zh="图个明白 · 原理与产业拆解">LayerLens | Visual explanations</title>
  <meta name="description" content="Explore a technical system or a value chain in one zoomable, sourced diagram.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div>
          <strong data-zh="图个明白">LayerLens</strong>

        </div>
      </div>
      <div class="top-actions">
        <button id="language" type="button" class="button subtle" lang="zh-CN">简体中文</button>
        <button id="download-json" type="button" class="button subtle" data-zh="下载可编辑稿">Download JSON</button>
        <button id="download-svg" type="button" class="button primary" data-zh="导出高清 SVG">Export SVG</button>
        <button id="download-png" type="button" class="button primary-alt" data-zh="导出 2× PNG">Export 2× PNG</button>
      </div>
    </header>
    <main class="workspace">
      <section class="editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading">
          <div>

            <h1 id="editor-title" data-zh="编辑拆解图稿">Edit diagram</h1>
            <p data-zh="粘贴 AI 生成的图文 JSON，右侧立即排版成一张图。">Paste a diagram specification to preview it.</p>
          </div>
        </div>
        <div class="example-row">
          <label for="example-select" data-zh="试用案例">Example</label>
          <select id="example-select">
            <option value="gpu" data-zh="GPU 的并行运算">GPU parallelism</option>
            <option value="robotics" data-zh="工业机器人产业链">Robotics value chain</option>
          </select>
        </div>
        <label class="editor-label" for="spec" data-zh="可编辑图文数据">Diagram JSON</label>
        <textarea id="spec" spellcheck="false" aria-describedby="format-help"></textarea>
        <p id="format-help" class="format-help" data-zh="修改图稿即可更新预览。点击图底的资料索引可查看依据。">Edits update the preview. Source links appear at the bottom of each diagram.</p>
        <div class="editor-footer">
          <span id="status" role="status" aria-live="polite"></span>
          <button id="copy-prompt" type="button" class="text-button" data-zh="复制 AI 生成指令">Copy AI prompt</button>
        </div>
      </section>
      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="preview-toolbar">
          <div>

            <h2 id="preview-title" data-zh="图文解释图">Preview</h2>
          </div>
          <div class="preview-controls">
            <span id="map-stats"></span>
            <button id="zoom-out" type="button" class="icon-button" aria-label="Zoom out" data-zh-aria="缩小">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" type="button" class="icon-button" aria-label="Zoom in" data-zh-aria="放大">+</button>
            <button id="fit" type="button" class="fit-button" data-zh="适合窗口">Fit to window</button>
          </div>
        </div>
        <div id="preview-scroll" class="preview-scroll">
          <div id="map" class="map" aria-live="polite"></div>
        </div>
        <div class="preview-hint" data-zh="SVG 适合放大阅读。PNG 以两倍宽度导出。">Export SVG for zooming or PNG for sharing.</div>
      </section>
    </main>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
